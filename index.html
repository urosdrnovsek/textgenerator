<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <title>Delovni list — Phase 3</title>
  <link rel="stylesheet" href="styles/worksheet.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/print.css" />
</head>
<body>
  <div class="app-shell no-print">
    <div class="app-sidebar">
      <label for="theme-select" data-label="field.theme">Tema</label>
      <select id="theme-select"></select>

      <label for="level-select" data-label="field.level">Stopnja</label>
      <select id="level-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>

      <div id="candidate-count" class="candidate-count"></div>
      <button id="btn-create" type="button" data-label="action.createText">Ustvari besedilo</button>

      <label for="name-input" data-label="field.childName">Ime otroka (neobvezno)</label>
      <input type="text" id="name-input" data-placeholder="field.childNamePlaceholder" maxlength="40" />

      <label for="writing-mode-select" data-label="field.writingMode">Način pisanja</label>
      <select id="writing-mode-select">
        <option value="read-copy" data-label="writingMode.read-copy">Beri in prepiši</option>
        <option value="read-only" data-label="writingMode.read-only">Samo branje</option>
      </select>

      <details class="settings-panel">
        <summary data-label="field.textSettings">Nastavitve besedila</summary>

        <button id="btn-dyslexia-preset" type="button" data-label="action.dyslexiaPreset">Prijazno za disleksijo</button>

        <label for="font-size-input" data-label="field.fontSize">Velikost pisave</label>
        <input type="number" id="font-size-input" step="1" />

        <label for="line-height-input" data-label="field.lineHeight">Razmik med vrsticami</label>
        <input type="number" id="line-height-input" step="0.1" />

        <label for="letter-spacing-input" data-label="field.letterSpacing">Razmik med črkami</label>
        <input type="number" id="letter-spacing-input" step="0.1" />

        <label for="word-spacing-input" data-label="field.wordSpacing">Dodaten razmik med besedami</label>
        <input type="number" id="word-spacing-input" step="0.1" />

        <label class="checkbox-label">
          <input type="checkbox" id="letter-colors-toggle" />
          <span data-label="field.letterColors">Barve zamenljivih črk (b/d/p/q)</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="syllable-colors-toggle" />
          <span data-label="field.syllableColors">Barve zlogov</span>
        </label>
      </details>

      <details class="settings-panel">
        <summary data-label="field.presets">Shranjene nastavitve</summary>

        <select id="preset-select"></select>
        <button id="btn-load-preset" type="button" data-label="action.loadPreset">Naloži</button>
        <button id="btn-delete-preset" type="button" data-label="action.deletePreset">Izbriši</button>
        <button id="btn-save-preset" type="button" data-label="action.savePreset">Shrani trenutne nastavitve</button>
        <div id="storage-status" class="storage-status"></div>
      </details>

      <button id="btn-print" type="button" data-label="action.print">Natisni / Shrani kot PDF</button>
      <button id="btn-docx" type="button" data-label="action.exportDocx">Izvozi v Word (.docx)</button>

      <div id="fit-indicator" class="fit-indicator" role="status">Preverjanje…</div>
    </div>
    <div class="preview-scroll">
      <div class="page-frame">
        <div id="preview"></div>
      </div>
    </div>
  </div>

  <div id="print-surface"></div>

  <script src="app.js"></script>
</body>
</html>
