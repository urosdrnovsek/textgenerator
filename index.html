<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <title>Writing Worksheet Generator</title>
  <!--
    Defense-in-depth per blueprint 13 ("A restrictive, tested Content
    Security Policy... Block network connections and object embedding;
    permit only the local/data/blob resource types actually required")
    (upgrade blueprint v3, workstream D4). style-src needs 'unsafe-inline'
    because render/html.js sets inline style properties on worksheet
    elements (font size, colors, spacing) — scripts stay entirely external.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <link rel="stylesheet" href="styles/worksheet.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/print.css" />
</head>
<body>
  <div class="app-shell no-print">
    <div class="app-sidebar">
      <label for="language-select" data-label="field.language">Jezik</label>
      <select id="language-select"></select>

      <label for="theme-select" data-label="field.theme">Tema</label>
      <select id="theme-select"></select>

      <label for="level-select" data-label="field.level">Stopnja</label>
      <select id="level-select">
        <option value="1" data-label="level.1">1 — zelo kratko, ~20–40 besed</option>
        <option value="2" data-label="level.2">2 — kratko, ~40–70 besed</option>
        <option value="3" data-label="level.3">3 — srednje, ~70–110 besed</option>
        <option value="4" data-label="level.4">4 — daljše, ~110–160 besed</option>
        <option value="5" data-label="level.5">5 — najdaljše, ~160–220 besed</option>
      </select>

      <div id="candidate-count" class="candidate-count"></div>
      <label for="text-select" id="text-select-label" data-label="field.textChoice" hidden>Besedilo</label>
      <select id="text-select" hidden></select>
      <button id="btn-create" type="button" data-label="action.createText">Ustvari besedilo</button>

      <label for="image-upload" data-label="field.customImage">Lastna slika (neobvezno)</label>
      <input type="file" id="image-upload" accept="image/png,image/jpeg" />
      <button id="btn-reset-image" type="button" data-label="action.resetImage" disabled></button>
      <div id="image-status" class="storage-status"></div>

      <label for="writing-mode-select" data-label="field.writingMode">Način pisanja</label>
      <select id="writing-mode-select">
        <option value="read-copy" data-label="writingMode.read-copy">Beri in prepiši</option>
        <option value="trace" data-label="writingMode.trace">Sledi črkam</option>
        <option value="read-only" data-label="writingMode.read-only">Samo branje</option>
      </select>

      <details class="settings-panel">
        <summary data-label="field.textSettings">Nastavitve besedila</summary>

        <button id="btn-dyslexia-preset" type="button" data-label="action.dyslexiaPreset">Prijazno za disleksijo</button>

        <label for="font-select" data-label="field.font">Pisava</label>
        <select id="font-select"></select>

        <label for="font-size-input" data-label="field.fontSize">Velikost pisave</label>
        <input type="number" id="font-size-input" step="1" />

        <label for="line-height-input" data-label="field.lineHeight">Razmik med vrsticami</label>
        <input type="number" id="line-height-input" step="0.1" />

        <label for="letter-spacing-input" data-label="field.letterSpacing">Razmik med črkami</label>
        <input type="number" id="letter-spacing-input" step="0.1" />

        <label for="word-spacing-input" data-label="field.wordSpacing">Dodaten razmik med besedami</label>
        <input type="number" id="word-spacing-input" step="0.1" />

        <label class="checkbox-label">
          <input type="checkbox" id="letter-colors-toggle" />
          <span data-label="field.letterColors">Barve zamenljivih črk (b/d/p/q)</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="syllable-colors-toggle" />
          <span data-label="field.syllableColors">Barve zlogov</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="syllable-separators-toggle" />
          <span data-label="field.syllableSeparators">Ločila med zlogi (Ma·ja)</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="sentence-per-line-toggle" />
          <span data-label="field.sentencePerLine">Ena poved na vrstico</span>
        </label>

        <label for="tint-select" data-label="field.tint">Barva ozadja</label>
        <select id="tint-select">
          <option value="none" data-label="tint.none">Brez</option>
          <option value="cream" data-label="tint.cream">Krem</option>
          <option value="blue" data-label="tint.blue">Svetlo modra</option>
          <option value="green" data-label="tint.green">Svetlo zelena</option>
        </select>

        <label class="checkbox-label">
          <input type="checkbox" id="print-tint-toggle" />
          <span data-label="field.printTint">Natisni tudi barvno ozadje</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="line-stripes-toggle" />
          <span data-label="field.lineStripes">Progaste vrstice</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="print-stripes-toggle" />
          <span data-label="field.printStripes">Natisni tudi proge</span>
        </label>

        <div class="panel-heading" data-label="field.header">Glava lista</div>

        <label class="checkbox-label">
          <input type="checkbox" id="header-nameline-toggle" />
          <span data-label="field.headerNameLine">Vrstica za ime</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="header-date-toggle" />
          <span data-label="field.headerDate">Datum</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="header-title-toggle" />
          <span data-label="field.headerTitle">Naslov</span>
        </label>

        <label for="guide-height-input" data-label="field.guideHeight">Višina črt za pisanje (mm)</label>
        <input type="number" id="guide-height-input" step="1" />
      </details>

      <details class="settings-panel">
        <summary data-label="field.presets">Shranjene nastavitve</summary>

        <select id="preset-select"></select>
        <button id="btn-load-preset" type="button" data-label="action.loadPreset">Naloži</button>
        <button id="btn-delete-preset" type="button" data-label="action.deletePreset">Izbriši</button>
        <button id="btn-save-preset" type="button" data-label="action.savePreset">Shrani trenutne nastavitve</button>
        <div id="storage-status" class="storage-status"></div>

        <div class="panel-heading" data-label="field.setupBackup">Varnostna kopija nastavitev</div>
        <button id="btn-export-setups" type="button" data-label="action.exportSetups">Izvozi moje nastavitve</button>
        <label for="import-setups-input" data-label="field.importSetups">Uvozi nastavitve (.json)</label>
        <input type="file" id="import-setups-input" accept="application/json" />

        <button id="btn-reset-data" type="button" data-label="action.resetData">Ponastavi shranjene podatke</button>
      </details>

      <details class="settings-panel">
        <summary data-label="field.packet">Sveženj listov</summary>

        <div id="packet-count" class="candidate-count"></div>
        <button id="btn-add-to-packet" type="button" data-label="action.addToPacket" disabled>Dodaj v sveženj</button>
        <ol id="packet-list"></ol>
        <button id="btn-print-packet" type="button" data-label="action.printPacket" disabled>Natisni sveženj</button>
        <button id="btn-clear-packet" type="button" data-label="action.clearPacket" disabled>Počisti sveženj</button>
        <div id="packet-status" class="storage-status"></div>
      </details>

      <details class="settings-panel">
        <summary data-label="field.importContent">Dodaj novo vsebino</summary>

        <label for="import-json-input" data-label="field.importJson">Datoteka z vsebino (.json)</label>
        <input type="file" id="import-json-input" accept="application/json" />
        <label for="import-images-input" data-label="field.importImages">Nove slike (neobvezno)</label>
        <input type="file" id="import-images-input" accept="image/png,image/jpeg" multiple />
        <button id="btn-import-content" type="button" data-label="action.importContent">Uvozi</button>
        <div id="import-status" class="storage-status"></div>
      </details>

      <div class="sidebar-actions">
        <button id="btn-print" type="button" data-label="action.print">Natisni / Shrani kot PDF</button>
        <button id="btn-docx" type="button" data-label="action.exportDocx">Izvozi v Word (.docx)</button>
        <div class="candidate-count" data-label="export.formatNote">Tiskanje / PDF ohrani postavitev natanko kot v predogledu. Word (.docx) je mogoče urejati in se lahko v urejevalniku nekoliko drugače prelomi.</div>
        <div id="fit-indicator" class="fit-indicator" role="status">Preverjanje…</div>
        <ul id="fit-notices" class="fit-notices" aria-live="polite" hidden></ul>
      </div>
    </div>
    <div class="preview-scroll">
      <div class="page-frame">
        <div id="preview" role="region" data-aria-label="preview.regionLabel" aria-label="Predogled delovnega lista"></div>
      </div>
    </div>
  </div>

  <!-- Off-screen twin of the preview for print.css. aria-hidden so screen
       readers don't announce the whole worksheet twice (workstream I1). -->
  <div id="print-surface" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
